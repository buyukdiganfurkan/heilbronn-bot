name: Auslaenderbehoerde erken randevu

on:
  schedule:
    - cron: "*/10 5-20 * * *"   # 06:00-22:00 arası her 10 dk (Almanya kış saati)
  workflow_dispatch:
    inputs:
      debug:
        description: "Sayfa metni ve ekran görüntüsünü Telegram'a gönder"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: state-commit
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install requests
      - run: python termin.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TERMIN_TELEGRAM_TOKEN: ${{ secrets.TERMIN_TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CURRENT_APPOINTMENT: ${{ vars.CURRENT_APPOINTMENT }}
          DEBUG: ${{ inputs.debug }}
      - name: Durumu kaydet
        if: always()
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add state
          git diff --cached --quiet || (git commit -m "termin state" && git pull --rebase && git push)
