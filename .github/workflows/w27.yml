name: W27 bos daire

on:
  schedule:
    - cron: "*/20 5-21 * * *"
  workflow_dispatch:
    inputs:
      debug:
        description: "Sayfa metni ve ekran goruntusunu Telegram'a gonder"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: state-commit
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt && python -m playwright install chromium
      - run: python w27.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DEBUG: ${{ inputs.debug }}
      - name: Durumu kaydet
        if: always()
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add state
          git diff --cached --quiet || (git commit -m "w27 state" && git pull --rebase && git push)
