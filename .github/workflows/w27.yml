name: W27 bos daire

on:
  schedule:
    - cron: "*/20 5-21 * * *"
  workflow_dispatch:
    inputs:
      debug:
        description: "Sayfa metni ve ekran goruntusunu Telegram'a gonder"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: state-commit
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt && python -m playwright install chromium
      - run: python w27.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DEBUG: ${{ inputs.debug }}
      - name: Durumu kaydet
        if: always()
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          rm -rf /tmp/st && cp -r state /tmp/st
          for i in 1 2 3 4; do
            git fetch -q origin main && git reset -q --hard origin/main
            mkdir -p state
            cp /tmp/st/w27.json state/ 2>/dev/null || true
            cp /tmp/st/chat.json state/ 2>/dev/null || true
            git add state
            if git diff --cached --quiet; then break; fi
            git commit -q -m "w27 state"
            if git push -q; then break; fi
            sleep $((i * 3))
          done
