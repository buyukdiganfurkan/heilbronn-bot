name: Ev siteleri takibi

on:
  schedule:
    # Saatler UTC. Almanya kis saatinde (UTC+1): 08:00, 09:30, 12:00, 16:00, 00:01
    - cron: "0 7,11,15 * * *"
    - cron: "30 8 * * *"
    - cron: "1 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: state-commit
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt && python -m playwright install --with-deps chromium
      - run: python evler.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Durumu kaydet
        if: always()
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          rm -rf /tmp/st && cp -r state /tmp/st
          for i in 1 2 3 4; do
            git fetch -q origin main && git reset -q --hard origin/main
            mkdir -p state
            cp /tmp/st/evler.json state/ 2>/dev/null || true
            git add state
            if git diff --cached --quiet; then break; fi
            git commit -q -m "evler state"
            if git push -q; then break; fi
            sleep $((i * 3))
          done
